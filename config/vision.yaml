# 画面识别的布局。坐标是参考分辨率下的像素，区间一律左闭右开。
#
# 参考分辨率是荣耀 PTP-AN00 横屏的 2800×1264。别的手机只要宽高比相同，程序会把画面缩放到
# 参考分辨率再读；宽高比不同的话，界面元素的相对位置会变，需要重新标定这份文件和 vision/templates/。
reference: [2800, 1264]

# 给识别用的那一路视频流（独立于投屏窗口）
stream:
  fps: 10
  bit_rate: 16000000
  # 数据机的序列号（adb devices 第一列）。一般留空：连着好几台设备（比如 Mac 上的 MuMu 模拟器也连进了 adb）时，
  # 识别服务会挑屏幕比例和上面 reference 一致的那一台。比例相同的设备不止一台时才需要填，
  # 或者启动时写 python -m vision --serial 序列号。
  serial:

# 每秒读几次
sample_hz: 5

# 每组字形里，相邻两个字的墨迹之间允许隔几个像素（负数 = 允许粘连）。
glyph_gaps:
  panel: [-2, 7]
  top-towers: [2, 10]
  top-gold: [2, 9]
  top-kills: [3, 14]
  clock: [1, 10]
  respawn: [1, 10]
  level: [0, 6]
  stats: [0, 8]

# 比赛时钟 mm:ss，居中显示。字是比例字体，位置会随数字左右挪几个像素，所以给一个宽一点的范围，
# 在里面找最像“两个数字、冒号、两个数字”的位置。
clock:
  ink: grey
  glyphs: clock
  rows: [86, 118]
  x: [1340, 1460]

# 顶部条。字的位置会随位数左右移动，所以每一项给一个足够宽、又避开图标的范围。
top:
  rows: [20, 62]
  fields:
    blue.towers: { x: [1086, 1150], ink: blue, glyphs: top-towers }
    blue.gold:   { x: [1160, 1300], ink: blue, glyphs: top-gold }
    blue.kills:  { x: [1302, 1366], ink: blue, glyphs: top-kills }
    red.kills:   { x: [1430, 1498], ink: red,  glyphs: top-kills }
    red.gold:    { x: [1570, 1672], ink: red,  glyphs: top-gold }
    red.towers:  { x: [1712, 1775], ink: red,  glyphs: top-towers }

# 底部面板：5 行，行距固定。蓝方 KDA 左对齐、经济右对齐，红方镜像。
panel:
  rows: [1008, 1032]          # 第一行（上路）；往下每行加 pitch
  pitch: 52
  count: 5
  ink: bright
  glyphs: panel
  fields:
    blue.kda:  [1186, 1302]
    blue.gold: [1304, 1392]
    red.gold:  [1496, 1582]
    red.kda:   [1584, 1700]
  # 面板展开时，这两段没有字的地方应该分别是蓝色底和红色底；收起后这里是游戏画面。
  # 每一行各检查一次，全部通过才认为面板是展开的。
  visible:
    blue: { x: [1142, 1182] }
    red:  { x: [1704, 1740] }

# 装备栏：和底部面板同一批行，每人 6 格，格子是正方形。x 是每一格的左边缘，**由外到内**排：
# 第一个是最外侧的鞋子格，后面五个是装备格（越靠后越靠近面板中间）。
items:
  top: 999                    # 第一行格子的上边缘；往下每行加 panel.pitch
  size: 44
  x:
    blue: [856, 902, 949, 997, 1044, 1091]
    red:  [1993, 1946, 1899, 1852, 1805, 1758]

# 两侧的选手卡片。阵亡时头像变成灰色，中间出现红色的复活倒计时（秒）；这里框的是头像中间出数字的那一块。
cards:
  ink: red
  glyphs: respawn
  rows:                       # 第一张卡片（上路）；往下每张加 pitch。左边的数字比右边高 4 个像素
    blue: [508, 552]
    red:  [512, 556]
  pitch: 155
  count: 5
  x:
    blue: [196, 258]
    red:  [2542, 2606]

# 原生顶部条两端的元素龙图标：哪一方拿了哪几条。每条龙占一个正方形格子，x 是格子的左边缘，由内到外排
# （第一条紧挨着推塔数，后面的往外排）。红方这一侧是按蓝方镜像推出来的，还没有在画面上见过。
dragons:
  top: 23
  size: 34
  x:
    blue: [980, 943, 905]
    red:  [1786, 1823, 1861]

# 小地图右边的野怪刷新牌子。top 是两块牌子各自的上边缘：upper 是先锋 / 男爵那个坑，lower 是小龙 / 远古龙那个坑。
# icon、text 的 rows 是相对牌子上边缘的。
chips:
  top: { upper: 99, lower: 189 }
  icon: { rows: [14, 60], x: [688, 732] }
  text: { rows: [18, 58], x: [738, 852] }

# 底部面板上方的事件时间轴。红方的事件在上面一行，蓝方在下面一行。实时 OB 里播放头固定在最右端（head），
# 新事件的图标以播放头为中心画出来；window 是播放头左右各看多少像素。
timeline:
  head: 1810
  window: 22
  rows:
    red:  [866, 918]
    blue: [930, 982]

# 两侧选手卡片上的召唤师技能（两个，上下排）和基石符文（在它们下面）。x、y 是第一张卡片（上路）第一个技能格
# 的左上角；第二个技能往下 skill_pitch，符文在第一个技能下面 rune_drop（并往左 1 个像素）；每张卡片往下 cards.pitch。
# 红方的比蓝方低 2 个像素。
spells:
  size: 33
  skill_pitch: 35
  rune_drop: 70
  origin:
    blue: [150, 493]
    red:  [2619, 495]

# 选手卡片头像上的两样东西（都是第一张卡片的位置，往下每张加 cards.pitch）：
#   · 右下角的等级数字（浅灰色，1–15）
#   · 上角的大招指示：一个圆点，没学大招时是暗的，转好了是整块绿色，冷却中是一块慢慢变大的绿色扇形。
#     蓝方在头像右上角，红方在左上角。centre 是圆心，radius 是只看圆心周围这么大的范围（比圆点略小，避开描边）。
levels:
  ink: grey
  glyphs: level
  rows:
    blue: [549, 569]
    red:  [550, 570]
  x:
    blue: [232, 262]
    red:  [2577, 2607]
ults:
  radius: 9
  centre:
    blue: [259, 502]
    red:  [2540, 503]


# 游戏自己的击杀播报（画面上方居中，“红方二连破”这一行字），用来认多杀。rows、x 是播报文字所在的那一块。
announce:
  rows: [195, 290]
  x: [1150, 1650]

# 结算页“统计 · 数据对比”（比赛结束后，数据机在结算界面点开“统计”，停在底部“数据”这一页、右上角“综合”）。
# 左右两半各 5 行（上野中下辅），每行 5 格：输出（数值 + 占全队的百分比）、总承伤、总治疗护盾（数值 + 百分比）、
# 参团率、总经济（数值 + 百分比）。数字是灰白色，每一项全场最高的那个是金色。
stats:
  glyphs: stats
  band: [303, 336]          # 第一行数字所在的一条，往下每行加 pitch；字的上沿在这条里按墨迹找
  pitch: 158.5
  count: 5
  height: 24                # 字形模板的高度（从字的上沿上面一行开始）
  word_gap: 12              # 数值和百分比之间的空白比这宽；同一个数里两个字之间的空白比这窄
  columns:                  # 每一格的 x 范围：left 是画面左半，right 是右半
    damage:  { left: [392, 590],   right: [1604, 1802] }
    taken:   { left: [592, 790],   right: [1804, 2002] }
    healing: { left: [790, 988],   right: [2002, 2200] }
    share:   { left: [988, 1186],  right: [2200, 2398] }
    gold:    { left: [1186, 1380], right: [2398, 2600] }
  # 认这一页：两半的表头（输出 总承伤 总治疗护盾 参团率 总经济）和模板比，相关系数到 match 才算
  header:
    rows: [178, 216]
    x: [380, 2600]
    match: 0.6
