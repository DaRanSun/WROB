# 装备价值（Loadout value）：每件装备在游戏内商店里的总价（金币）。导播台按 L（团战 UI 开着时自动）在底部两侧显示
# 双方身上装备的价值总和和各占的百分比。
# 来源：用户 2026-10-24 给的游戏内商店截图（../loadout value/，18 张）：按格子切出图标和价格，图标和装备库比对认名字，
# 价格用数字模板读，再逐件和截图核对过。同一件装备出现在几个分类里的，各处价格一致。
# 价格随版本变：直接改这里，重启服务生效。名字要和 items.yaml 里的一致（写错了启动时报错）。

