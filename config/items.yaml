# 从上到下、再右列从上到下，翻页时重复出现的只记第一次（tools/build_items.py 按这个顺序把名字和图标对上）。
#
# 名字同时就是装备的编号：状态里存的、图标文件名用的都是它。改名要连 assets/items/ 里的图一起改。
# 游戏更新后：重新截图 → 把新装备的名字按位置插进来 → 重跑 tools/build_items.py。

