# 装备和召唤师技能的冷却（秒），用户 2026-10-12 提供。随版本更新。
#
# 用法：原生界面上图标由亮转暗的那一刻算作“用掉了”，面板从那一刻起按这里的时长读条；
# 原生图标提前亮回来（比如有技能急速）读条就提前结束。

# 冷却不超过这么多秒的装备不读条（耀光、三相这类一两秒就好的被动，读条没有意义）。
show_above: 6

# 团战 UI 只显示“关键装备”：上面会读条的装备（冷却超过 show_above 秒），除了这里列的（用户 2026-10-24 定）。
# 三级水银鞋（带链碾碎者）、三级护甲鞋（装甲战靴）打团时没那么重要；对位面板上照样读条。
teamfight_exclude: [卢登的回声, 带链碾碎者, 装甲战靴]

# 炽天使之拥（大天使的护盾）故意不在下表：手游原生界面不显示它的状态（有瑞兹的那局看得到），读不出冷却，
# 所以面板上不读条、团战 UI 也不显示。
