# 同一个技能的两个样子，共用一条冷却：6 分钟时“传送”变成“解封的传送”，正在走的读条接着走。
shared:
  - [传送, 解封的传送]

# 开局就在冷却的技能：游戏时间走到这一秒才第一次可用（传送开局有 43 秒冷却，游戏内计时 0:30 时转好）。
opening:
  传送: 30

# 有充能机制的技能：不读条，只跟着原生图标显示亮 / 暗。
charged: [惩戒]

# 这些鞋子缩短召唤师技能的冷却（比例）。
spell_haste:
  明朗之靴: 0.15
  猩红明朗: 0.20
