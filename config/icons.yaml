# 召唤师技能和基石符文的图标，来自掌盟“资料 → 技能 / 符文”页的截图（../spellrune/，7 张）。
# 下面按截图的先后、每张截图里从上到下，一个图标一行；tools/build_icons.py import 按这个顺序把名字和图标对上。
# 写 skip 的不要：没截全的（同一个图标在相邻截图里有完整的），或者召唤师峡谷里不会出现的。
#
# 名字就是编号：状态里存的、图标文件名、config/cooldowns.yaml 里用的都是它。
spells:
  - 幽灵疾步
  - skip          # 标记（嚎哭深渊专用）
  - 治疗术
  - 屏障
  - 虚弱
  - 净化
  - 闪现
  - 引燃
  - skip          # 引燃，上半截被标题栏挡住了
  - 惩戒
  - 传送
runes:
  - 不灭之握
  - 征服者
  - 电击
  - 艾黎
  - 相位猛冲
  - 迅捷步法
  - 致命节奏
  - 先攻
  - 强攻
  - 奥术彗星
  - 黑暗收割
  - 冰霜领主
  - 守护者

